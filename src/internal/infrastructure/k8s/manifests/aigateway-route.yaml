apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: ${INFERENCE_POOL_NAME}
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: ${INFERENCE_POOL_NAME}
    app.kubernetes.io/part-of: oscar-inferencemesh
    oscar-inferencemesh.io/model: ${MODEL_NAME}
spec:
  targetPorts:
    - number: ${TARGET_BACKEND_PORT}
  selector:
    matchLabels:
      app.kubernetes.io/name: ${MODEL_NAME}
      kserve.io/component: workload
  endpointPickerRef:
    group: ""
    kind: Service
    name: ${EPP_SERVICE_NAME}
    port:
      number: ${EPP_GRPC_PORT}
    failureMode: FailOpen
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: ${ROUTE_NAME}
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: ${ROUTE_NAME}
    app.kubernetes.io/part-of: oscar-inferencemesh
    oscar-inferencemesh.io/model: ${MODEL_NAME}
spec:
  parentRefs:
    - name: ${GATEWAY_NAME}
      namespace: ${GATEWAY_NAMESPACE}
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    - name: ${ROUTE_RULE_NAME}
      matches:
        - headers:
            - name: x-ai-eg-model
              value: ${MODEL_NAME}
      backendRefs:
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: ${INFERENCE_POOL_NAME}
          weight: 1
