apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: ${EXTENSION_POLICY_NAME}
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: ${EXTENSION_POLICY_NAME}
    app.kubernetes.io/part-of: oscar-inferencemesh
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ${GATEWAY_NAME}
  extProc:
    - backendRefs:
        - group: ""
          kind: Service
          name: ${EPP_SERVICE_NAME}
          port: ${EPP_GRPC_PORT}
      failOpen: true
      processingMode:
        request: {}
        response: {}
